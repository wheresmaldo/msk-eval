# Copy to config.yaml and edit. Keys come from environment variables, never this file:
#   databricks: DATABRICKS_HOST and DATABRICKS_TOKEN
#   openai:     OPENAI_API_KEY
#   anthropic:  ANTHROPIC_API_KEY
# Prices are USD per million tokens, used only to report cost. Check current prices before quoting.

models:
  - name: GPT-5
    provider: databricks
    model: databricks-gpt-5
  - name: Gemini 3.6 Flash
    provider: databricks
    model: databricks-gemini-3-6-flash
  - name: DeepSeek V4.1 Flash
    provider: databricks
    model: databricks-deepseek-v4-1-flash

# The grader is a different vendor from the models it grades, to avoid self-preference.
judge:
  name: Grader (Claude Sonnet 4.5)
  provider: databricks
  model: databricks-claude-sonnet-4-5
